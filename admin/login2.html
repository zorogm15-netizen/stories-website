<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول لوحة الإدارة</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js?v=login2"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      font-family: Arial, sans-serif;
    }
    .box {
      width: min(90%, 400px);
      background: #1f2937;
      padding: 30px;
      border-radius: 16px;
      box-sizing: border-box;
    }
    h1 {
      color: white;
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 0;
    }
    button {
      cursor: pointer;
      font-weight: bold;
    }
    #message {
      color: #f87171;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>🔐 لوحة الإدارة</h1>

  <form id="loginForm">
    <input id="email" type="email" placeholder="البريد الإلكتروني" required>
    <input id="password" type="password" placeholder="كلمة المرور" required>
    <button type="submit">تسجيل الدخول</button>
  </form>

  <div id="message"></div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const message = document.getElementById('message');
  message.textContent = 'جاري تسجيل الدخول...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const result = await signIn(email, password);

  if (!result.success) {
    message.textContent = result.error;
    return;
  }

  const user = await getCurrentUser();

  if (!user) {
    message.textContent = 'تعذر الحصول على بيانات المستخدم';
    return;
  }

  const isAdmin = await isUserAdmin(user.id);

  if (!isAdmin) {
    await signOut();
    message.textContent = 'هذا الحساب ليس حساب مدير';
    return;
  }

  window.location.href = 'dashboard.html';
});
</script>

</body>
</html>
