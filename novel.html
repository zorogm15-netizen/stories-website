<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رِواق | تفاصيل الرواية</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg-dark:#0f1419;--bg-card:#1a1f2e;--bg-hover:#242d3d;--primary-gold:#d4af37;--primary-gold-light:#e6c547;--text-primary:#f5f1e8;--text-secondary:#b8b4a8;--text-muted:#7a7a7a;--border-color:#2a3344;--accent-purple:#6b5b95;--accent-blue:#1e3c72;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Lora',serif;background:var(--bg-dark);color:var(--text-primary);line-height:1.8;}
.topbar{background:rgba(15,20,25,0.97);border-bottom:1px solid var(--border-color);padding:0.9rem 1.2rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:100;}
.back-btn{color:var(--primary-gold);cursor:pointer;font-size:0.95rem;white-space:nowrap;}
.back-btn:hover{text-decoration:underline;}
.topbar h1{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--primary-gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.container{max-width:800px;margin:0 auto;padding:2rem 1.2rem 4rem;}
.cover{height:220px;border-radius:12px;background:linear-gradient(135deg,var(--accent-purple),var(--accent-blue));display:flex;align-items:center;justify-content:center;font-size:4rem;background-size:cover;background-position:center;margin-bottom:1.5rem;}
.title{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--text-primary);margin-bottom:0.4rem;}
.author{color:var(--text-muted);font-size:0.95rem;margin-bottom:1rem;}
.category{display:inline-block;background:rgba(212,175,55,0.15);color:var(--primary-gold);font-size:0.78rem;padding:0.25rem 0.8rem;border-radius:12px;margin-bottom:1.2rem;}
.desc{color:var(--text-secondary);line-height:1.8;margin-bottom:2rem;}
.chapters-title{font-family:'Playfair Display',serif;color:var(--primary-gold);font-size:1.2rem;margin-bottom:1rem;}
.chapters-list{list-style:none;}
.chapters-list li{background:var(--bg-card);border:1px solid var(--border-color);border-radius:8px;padding:1rem 1.2rem;margin-bottom:0.7rem;cursor:pointer;transition:all 0.2s ease;display:flex;justify-content:space-between;align-items:center;}
.chapters-list li:hover{border-color:var(--primary-gold);background:var(--bg-hover);}
.chapters-list .chnum{color:var(--text-muted);font-size:0.8rem;}
.empty-state{text-align:center;color:var(--text-muted);padding:2rem;border:2px dashed var(--border-color);border-radius:10px;}
.loading{text-align:center;color:var(--text-secondary);padding:3rem;}
</style>
</head>
<body>
<div class="topbar">
    <span class="back-btn" onclick="location.href='index.html#stories'">→ رجوع</span>
    <h1 id="topbarTitle">رِواق</h1>
</div>
<div class="container" id="pageBody">
    <div class="loading">جاري التحميل...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js?v=5"></script>
<script>
function escapeHtml(str){
    if(str===null||str===undefined) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getNovelIdFromUrl(){
    const params = new URLSearchParams(window.location.search);
    return params.get('id');
}

async function loadNovelPage(){
    const novelId = getNovelIdFromUrl();
    const body = document.getElementById('pageBody');
    if(!novelId){
        body.innerHTML = '<div class="empty-state">لم يتم تحديد رواية.</div>';
        return;
    }

    const [novelResult, chaptersResult] = await Promise.all([
        getNovel(novelId),
        getChapters(novelId, true)
    ]);

    if(!novelResult.success || !novelResult.data){
        body.innerHTML = '<div class="empty-state">تعذر تحميل هذه الرواية.</div>';
        return;
    }

    const novel = novelResult.data;
    const chapters = chaptersResult.success ? chaptersResult.data : [];

    document.getElementById('topbarTitle').textContent = novel.title_ar;
    document.title = `رِواق | ${novel.title_ar}`;

    const chaptersHtml = chapters.length > 0
        ? `<ul class="chapters-list">${chapters.map(ch => `
            <li onclick="location.href='reader.html?novel=${novelId}&chapter=${ch.id}'">
                <span>الفصل ${ch.chapter_number}: ${escapeHtml(ch.title)}</span>
                <span class="chnum">›</span>
            </li>
        `).join('')}</ul>`
        : `<div class="empty-state">لا توجد فصول منشورة بعد لهذه الرواية.</div>`;

    body.innerHTML = `
        <div class="cover" style="${novel.cover_url ? `background-image:url('${novel.cover_url}')` : ''}">
            ${novel.cover_url ? '' : '📖'}
        </div>
        <div class="title">${escapeHtml(novel.title_ar)}</div>
        <div class="author">✍️ بقلم: ${escapeHtml(novel.author)}</div>
        <span class="category">${escapeHtml(novel.category_name || 'رواية')}</span>
        <p class="desc">${escapeHtml(novel.description || '')}</p>
        <div class="chapters-title">📖 الفصول</div>
        ${chaptersHtml}
    `;
}

document.addEventListener('DOMContentLoaded', loadNovelPage);
</script>
</body>
</html>
