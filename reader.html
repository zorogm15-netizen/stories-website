<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القراءة | رِواق</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Tajawal:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('riwaq-theme');
                if (saved) document.documentElement.setAttribute('data-theme', saved);
            } catch (e) {}
        })();
    </script>
    <style>
        :root, :root[data-theme="night-space"] {
            --bg-dark: #0f1419;
            --bg-card: #1a1f2e;
            --bg-hover: #242d3d;
            --primary-gold: #d4af37;
            --primary-gold-light: #e6c547;
            --text-primary: #f5f1e8;
            --text-secondary: #b8b4a8;
            --text-muted: #7a7a7a;
            --border-color: #2a3344;
            --reader-font-size: 18px;
            --reader-font-family: 'Lora', serif;
        }
        :root[data-theme="pure-light"] {
            --bg-dark: #faf8f4; --bg-card: #ffffff; --bg-hover: #f1ede4;
            --primary-gold: #b8892f; --primary-gold-light: #cf9e3f;
            --text-primary: #241f18; --text-secondary: #5b5648; --text-muted: #8c8676;
            --border-color: #e4ddcd;
        }
        :root[data-theme="velvet-black"] {
            --bg-dark: #000000; --bg-card: #121212; --bg-hover: #1c1c1c;
            --primary-gold: #d4af37; --primary-gold-light: #e6c547;
            --text-primary: #f0f0f0; --text-secondary: #a8a8a8; --text-muted: #6e6e6e;
            --border-color: #262626;
        }
        :root[data-theme="warm-paper"] {
            --bg-dark: #f1e6ce; --bg-card: #f8f0dc; --bg-hover: #ecdec0;
            --primary-gold: #9c6b2e; --primary-gold-light: #b5813e;
            --text-primary: #3a2d1c; --text-secondary: #6b5a3f; --text-muted: #93816e;
            --border-color: #ddcca4;
        }
        :root[data-theme="moon-blossom"] {
            --bg-dark: #221726; --bg-card: #2e1c35; --bg-hover: #3a2542;
            --primary-gold: #e0a3c4; --primary-gold-light: #edb8d3;
            --text-primary: #f7ecf3; --text-secondary: #cba7c0; --text-muted: #8f7690;
            --border-color: #40293f;
        }
        :root[data-theme="stillness"] {
            --bg-dark: #201810; --bg-card: #2b2116; --bg-hover: #362a1c;
            --primary-gold: #c99a4b; --primary-gold-light: #d8ac60;
            --text-primary: #ece2d2; --text-secondary: #b6a689; --text-muted: #7d715c;
            --border-color: #3a2e1f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Lora', serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ==================== Top Bar ==================== */
        .reader-topbar {
            background: rgba(15, 20, 25, 0.97);
            background: color-mix(in srgb, var(--bg-dark) 92%, transparent);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.9rem 1.2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-gold);
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }

        .back-btn:hover {
            color: var(--primary-gold-light);
        }

        .reader-titles {
            text-align: center;
            flex: 1;
            min-width: 140px;
        }

        .reader-titles .novel-name {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .reader-titles .chapter-name {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .auth-link {
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .auth-link:hover {
            color: var(--primary-gold);
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.78rem;
            color: var(--primary-gold);
        }

        .settings-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .settings-toggle:hover,
        .settings-toggle.active {
            color: var(--primary-gold);
            border-color: var(--primary-gold);
        }

        .autoscroll-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0 0.7rem;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .autoscroll-toggle.active {
            color: var(--primary-gold);
            border-color: var(--primary-gold);
            background: rgba(212, 175, 55, 0.08);
        }

        /* ==================== Settings Panel ==================== */
        .settings-panel {
            display: none;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem;
            position: sticky;
            top: 65px;
            z-index: 99;
        }

        .settings-panel.show {
            display: block;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            max-width: 600px;
            margin: 0 auto 1rem;
            flex-wrap: wrap;
        }

        .settings-row:last-child {
            margin-bottom: 0;
        }

        .settings-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            min-width: 90px;
        }

        .font-size-controls {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .font-size-controls button {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-dark);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-size-controls button:hover {
            border-color: var(--primary-gold);
            color: var(--primary-gold);
        }

        .font-size-value {
            min-width: 34px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .font-family-options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .font-family-btn {
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-dark);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
        }

        .font-family-btn.active {
            border-color: var(--primary-gold);
            color: var(--primary-gold);
            background: rgba(212, 175, 55, 0.08);
        }

        /* ==================== Word Filters ==================== */
        .word-filter-section {
            max-width: 600px;
            margin: 0 auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .word-filter-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.7rem;
        }

        .word-filter-form {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }

        .word-filter-form input {
            flex: 1;
            min-width: 110px;
            padding: 0.55rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-dark);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: inherit;
        }

        .word-filter-form input:focus {
            outline: none;
            border-color: var(--primary-gold);
        }

        .word-filter-form button {
            padding: 0.55rem 1rem;
            border: none;
            border-radius: 6px;
            background: var(--primary-gold);
            color: var(--bg-dark);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .word-filter-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 160px;
            overflow-y: auto;
        }

        .word-filter-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            background: var(--bg-hover);
            border-radius: 6px;
            padding: 0.45rem 0.7rem;
            font-size: 0.82rem;
            color: var(--text-primary);
        }

        .word-filter-item .wf-pair {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            overflow: hidden;
        }

        .word-filter-item .wf-pair span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .word-filter-item .wf-from {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .word-filter-item .wf-to {
            color: var(--primary-gold-light);
            font-weight: 600;
        }

        .word-filter-remove {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.95rem;
            padding: 0 0.2rem;
        }

        .word-filter-remove:hover {
            color: #ff8787;
        }

        .word-filter-empty {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            padding: 0.4rem 0;
        }

        /* ==================== Reader Body ==================== */
        .reader-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
        }

        .chapter-block {
            margin-bottom: 1rem;
        }

        .chapter-block + .chapter-block {
            margin-top: 3rem;
            padding-top: 3rem;
            border-top: 2px dashed var(--border-color);
        }

        .reader-header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .reader-header .chapter-label {
            font-size: 0.8rem;
            color: var(--primary-gold);
            margin-bottom: 0.4rem;
        }

        .reader-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--text-primary);
        }

        .reader-content {
            font-family: var(--reader-font-family);
            font-size: var(--reader-font-size);
            line-height: 2;
            white-space: pre-wrap;
            color: var(--text-primary);
        }

        .reader-loading,
        .reader-error {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-secondary);
        }

        .reader-error i {
            font-size: 2rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: block;
        }

        .loading-next {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }

        .loading-next .spinner {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border-color);
            border-top-color: var(--primary-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .end-of-novel {
            text-align: center;
            padding: 3rem 1rem 1rem;
            color: var(--text-secondary);
        }

        .end-of-novel i {
            font-size: 1.8rem;
            color: var(--primary-gold);
            margin-bottom: 0.8rem;
            display: block;
        }

        .end-of-novel a {
            color: var(--primary-gold);
            text-decoration: none;
        }

        .end-of-novel a:hover {
            text-decoration: underline;
        }

        /* ==================== Chapter Navigation ==================== */
        .chapter-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .chapter-nav-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.2rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chapter-nav-btn:hover {
            border-color: var(--primary-gold);
            color: var(--primary-gold);
        }

        .chapter-nav-btn.disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        .chapter-nav-btn.next {
            margin-right: auto;
        }

        /* ==================== Comments ==================== */
        .comments-section {
            margin-top: 2.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .comments-section h3 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-gold);
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .comment-item {
            background: var(--bg-hover);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.7rem;
        }

        .comment-item .comment-author {
            font-size: 0.82rem;
            color: var(--primary-gold);
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .comment-item .comment-content {
            font-size: 0.92rem;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .comment-item .comment-date {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        .comment-form textarea {
            width: 100%;
            min-height: 80px;
            padding: 0.7rem 0.9rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.92rem;
            resize: vertical;
            margin-bottom: 0.6rem;
        }

        .comment-form textarea:focus {
            outline: none;
            border-color: var(--primary-gold);
        }

        .comment-form button {
            padding: 0.6rem 1.4rem;
            border: none;
            border-radius: 6px;
            background: var(--primary-gold);
            color: var(--bg-dark);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.88rem;
        }

        .comment-form button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .comment-login-hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            padding: 0.8rem;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
        }

        /* ==================== Auth Modal ==================== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            padding: 2rem;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            left: 1.2rem;
            font-size: 1.6rem;
            color: var(--text-secondary);
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--primary-gold);
        }

        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .auth-tab.active {
            color: var(--bg-dark);
            background: var(--primary-gold);
            border-color: var(--primary-gold);
            font-weight: 600;
        }

        .auth-field {
            margin-bottom: 1rem;
        }

        .auth-field label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .auth-field input {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-dark);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
        }

        .auth-field input:focus {
            outline: none;
            border-color: var(--primary-gold);
        }

        .auth-submit {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            background: var(--primary-gold);
            color: var(--bg-dark);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .auth-submit:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .auth-message {
            margin-top: 0.9rem;
            font-size: 0.85rem;
            text-align: center;
            min-height: 1.2em;
        }

        .auth-message.error {
            color: #ff8787;
        }

        .auth-message.success {
            color: #7ee787;
        }

        /* ==================== XP Toast ==================== */
        .xp-toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--primary-gold);
            color: var(--bg-dark);
            padding: 0.7rem 1.4rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
            z-index: 3000;
            opacity: 0;
            transition: all 0.35s ease;
            pointer-events: none;
        }

        .xp-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ==================== Responsive ==================== */
        @media (max-width: 480px) {
            .reader-topbar {
                padding: 0.7rem 0.9rem;
            }

            .reader-titles .chapter-name {
                font-size: 0.9rem;
            }

            .reader-container {
                padding: 1.8rem 1.1rem 3rem;
            }

            .reader-header h1 {
                font-size: 1.3rem;
            }

            .settings-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .chapter-nav-btn span {
                display: none;
            }

            .autoscroll-toggle span {
                display: none;
            }

            .user-badge span:not(.badge-icon) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="reader-topbar">
        <button class="back-btn" onclick="goBackToNovel()">
            <i class="fas fa-arrow-right"></i> رجوع
        </button>
        <div class="reader-titles">
            <div class="novel-name" id="novelNameLabel">...</div>
            <div class="chapter-name" id="chapterNameLabel">جاري التحميل...</div>
        </div>
        <div class="topbar-actions">
            <div id="authArea"><span class="auth-link" onclick="openAuthModal('login')">دخول</span></div>
            <button class="autoscroll-toggle active" id="autoscrollToggle" onclick="toggleAutoScroll()" title="التمرير اللانهائي: تحميل الفصل التالي تلقائياً">
                <i class="fas fa-infinity"></i> <span>تلقائي</span>
            </button>
            <button class="settings-toggle" id="settingsToggle" onclick="toggleSettingsPanel()" aria-label="إعدادات القراءة">
                <i class="fas fa-text-height"></i>
            </button>
        </div>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="settings-row">
            <span class="settings-label">حجم الخط</span>
            <div class="font-size-controls">
                <button onclick="changeFontSize(-2)" aria-label="تصغير الخط">A-</button>
                <span class="font-size-value" id="fontSizeValue">18</span>
                <button onclick="changeFontSize(2)" aria-label="تكبير الخط">A+</button>
            </div>
        </div>
        <div class="settings-row">
            <span class="settings-label">نوع الخط</span>
            <div class="font-family-options" id="fontFamilyOptions">
                <button class="font-family-btn" data-font="'Lora', serif" onclick="setFontFamily(this)">افتراضي</button>
                <button class="font-family-btn" data-font="'Tajawal', sans-serif" onclick="setFontFamily(this)">حديث</button>
                <button class="font-family-btn" data-font="'Amiri', serif" onclick="setFontFamily(this)">تقليدي</button>
            </div>
        </div>
        <div class="settings-row">
            <span class="settings-label">التمرير اللانهائي</span>
            <div class="font-family-options">
                <button class="font-family-btn" id="autoscrollOnBtn" onclick="setAutoScroll(true)">تحميل تلقائي</button>
                <button class="font-family-btn" id="autoscrollOffBtn" onclick="setAutoScroll(false)">يدوي (زر التالي)</button>
            </div>
        </div>
        <div class="word-filter-section">
            <div class="word-filter-title">استبدال كلمات حسب رغبتك (يظهر لك فقط، ولا يغيّر النص الأصلي)</div>
            <form class="word-filter-form" id="wordFilterForm">
                <input type="text" id="wfFromInput" placeholder="الكلمة الأصلية" required>
                <input type="text" id="wfToInput" placeholder="استبدلها بـ" required>
                <button type="submit">إضافة</button>
            </form>
            <div class="word-filter-list" id="wordFilterList"></div>
        </div>
    </div>

    <div class="reader-container">
        <div id="chaptersFeed">
            <div class="reader-loading">جاري التحميل...</div>
        </div>
        <div id="scrollSentinel" style="height:1px;"></div>
    </div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModalOverlay">
        <div class="modal-box">
            <span class="modal-close" onclick="closeAuthModal()">&times;</span>
            <div class="auth-tabs">
                <div class="auth-tab active" id="authTabLogin" onclick="switchAuthTab('login')">تسجيل الدخول</div>
                <div class="auth-tab" id="authTabSignup" onclick="switchAuthTab('signup')">حساب جديد</div>
            </div>
            <form id="authForm">
                <div class="auth-field">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="authEmail" required>
                </div>
                <div class="auth-field">
                    <label>كلمة المرور</label>
                    <input type="password" id="authPassword" required minlength="6">
                </div>
                <button type="submit" class="auth-submit" id="authSubmitBtn">تسجيل الدخول</button>
            </form>
            <div class="auth-message" id="authMessage"></div>
        </div>
    </div>

    <div class="xp-toast" id="xpToast"></div>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js?v=6"></script>

    <script>
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        const params = new URLSearchParams(window.location.search);
        const novelId = params.get('novel');
        const initialChapterId = params.get('chapter');

        let allChapters = [];      // full ordered chapter list for this novel (asc by chapter_number)
        let currentNovel = null;
        let loadedChapters = [];   // chapters currently rendered in the feed, in order
        let isLoadingNext = false;
        let reachedEnd = false;
        let activeChapterId = null; // chapter currently considered "in view" (drives topbar/URL)

        /* ==================== Auto-scroll (infinite scroll) toggle ==================== */
        function getAutoScrollPref() {
            const saved = localStorage.getItem('riwaq_autoscroll');
            return saved === null ? true : saved === '1';
        }
        function applyAutoScrollUI(enabled) {
            const toggle = document.getElementById('autoscrollToggle');
            toggle.classList.toggle('active', enabled);
            document.getElementById('autoscrollOnBtn').classList.toggle('active', enabled);
            document.getElementById('autoscrollOffBtn').classList.toggle('active', !enabled);
        }
        function setAutoScroll(enabled) {
            localStorage.setItem('riwaq_autoscroll', enabled ? '1' : '0');
            applyAutoScrollUI(enabled);
        }
        function toggleAutoScroll() {
            setAutoScroll(!getAutoScrollPref());
        }

        /* ==================== Font Settings ==================== */
        function loadFontPrefs() {
            const savedSize = localStorage.getItem('riwaq_font_size');
            const savedFamily = localStorage.getItem('riwaq_font_family');

            const size = savedSize ? parseInt(savedSize, 10) : 18;
            document.documentElement.style.setProperty('--reader-font-size', size + 'px');
            document.getElementById('fontSizeValue').textContent = size;

            const family = savedFamily || "'Lora', serif";
            document.documentElement.style.setProperty('--reader-font-family', family);

            document.querySelectorAll('.font-family-btn[data-font]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.font === family);
            });

            applyAutoScrollUI(getAutoScrollPref());
        }

        function changeFontSize(delta) {
            const current = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--reader-font-size'), 10) || 18;
            let next = current + delta;
            next = Math.max(14, Math.min(32, next));
            document.documentElement.style.setProperty('--reader-font-size', next + 'px');
            document.getElementById('fontSizeValue').textContent = next;
            localStorage.setItem('riwaq_font_size', next);
        }

        function setFontFamily(btn) {
            const family = btn.dataset.font;
            document.documentElement.style.setProperty('--reader-font-family', family);
            localStorage.setItem('riwaq_font_family', family);
            document.querySelectorAll('.font-family-btn[data-font]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function toggleSettingsPanel() {
            const panel = document.getElementById('settingsPanel');
            const toggle = document.getElementById('settingsToggle');
            panel.classList.toggle('show');
            toggle.classList.toggle('active');
        }

        /* ==================== Word Filters (per-reader, stored locally) ==================== */
        const WORD_FILTER_KEY = 'riwaq_word_filters';

        function getWordFilters() {
            try {
                const raw = JSON.parse(localStorage.getItem(WORD_FILTER_KEY) || '[]');
                return Array.isArray(raw) ? raw : [];
            } catch (e) {
                return [];
            }
        }

        function saveWordFilters(filters) {
            localStorage.setItem(WORD_FILTER_KEY, JSON.stringify(filters));
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Applies the reader's own word substitutions to raw chapter text.
        // Runs BEFORE escapeHtml, so replacement text is escaped just like the rest of the chapter.
        function applyWordFilters(text) {
            if (!text) return text;
            const filters = getWordFilters();
            if (!filters.length) return text;

            let result = text;
            filters.forEach(f => {
                if (!f || !f.from) return;
                try {
                    // Unicode-aware word boundaries so it works correctly with Arabic text too.
                    const pattern = new RegExp(`(?<![\\p{L}\\p{N}])${escapeRegex(f.from)}(?![\\p{L}\\p{N}])`, 'gu');
                    result = result.replace(pattern, f.to);
                } catch (e) {
                    // Skip a bad pattern rather than break the whole chapter render.
                    console.error('Word filter error:', e);
                }
            });
            return result;
        }

        function renderWordFiltersUI() {
            const listEl = document.getElementById('wordFilterList');
            const filters = getWordFilters();

            if (!filters.length) {
                listEl.innerHTML = `<div class="word-filter-empty">لم تُضِف أي استبدال بعد</div>`;
                return;
            }

            listEl.innerHTML = filters.map((f, i) => `
                <div class="word-filter-item">
                    <div class="wf-pair">
                        <span class="wf-from">${escapeHtml(f.from)}</span>
                        <i class="fas fa-arrow-left" style="font-size:0.7rem;color:var(--text-muted);"></i>
                        <span class="wf-to">${escapeHtml(f.to)}</span>
                    </div>
                    <button class="word-filter-remove" onclick="removeWordFilter(${i})" aria-label="حذف">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
        }

        function addWordFilter(from, to) {
            from = from.trim();
            to = to.trim();
            if (!from || !to) return;

            const filters = getWordFilters();
            const existingIdx = filters.findIndex(f => f.from === from);
            if (existingIdx >= 0) {
                filters[existingIdx].to = to;
            } else {
                filters.push({ from, to });
            }
            saveWordFilters(filters);
            renderWordFiltersUI();
            rerenderAllChapterContents();
        }

        function removeWordFilter(index) {
            const filters = getWordFilters();
            filters.splice(index, 1);
            saveWordFilters(filters);
            renderWordFiltersUI();
            rerenderAllChapterContents();
        }

        // Re-applies filters to every already-loaded chapter without a full reload.
        function rerenderAllChapterContents() {
            loadedChapters.forEach(ch => {
                const contentEl = document.getElementById(`content-${ch.id}`);
                if (contentEl) contentEl.innerHTML = escapeHtml(applyWordFilters(ch.content));
            });
        }

        document.getElementById('wordFilterForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const fromInput = document.getElementById('wfFromInput');
            const toInput = document.getElementById('wfToInput');
            addWordFilter(fromInput.value, toInput.value);
            fromInput.value = '';
            toInput.value = '';
            fromInput.focus();
        });

        /* ==================== XP Toast ==================== */
        let xpToastTimer = null;
        function showXpToast(amount) {
            const toast = document.getElementById('xpToast');
            if (!toast) return;
            toast.textContent = `✨ +${amount} XP`;
            toast.classList.add('show');
            clearTimeout(xpToastTimer);
            xpToastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        /* ==================== Auth ==================== */
        let authMode = 'login';

        function openAuthModal(mode) {
            switchAuthTab(mode || 'login');
            document.getElementById('authModalOverlay').classList.add('show');
        }

        function closeAuthModal() {
            document.getElementById('authModalOverlay').classList.remove('show');
            document.getElementById('authMessage').textContent = '';
            document.getElementById('authMessage').className = 'auth-message';
        }

        function switchAuthTab(mode) {
            authMode = mode;
            document.getElementById('authTabLogin').classList.toggle('active', mode === 'login');
            document.getElementById('authTabSignup').classList.toggle('active', mode === 'signup');
            document.getElementById('authSubmitBtn').textContent = mode === 'login' ? 'تسجيل الدخول' : 'إنشاء الحساب';
        }

        async function handleUserBadgeClick() {
            if (!confirm('هل تريد تسجيل الخروج؟')) return;
            await signOut();
            await refreshAuthUI();
        }

        async function refreshAuthUI() {
            const authArea = document.getElementById('authArea');
            const session = await checkAuth();

            if (!session) {
                authArea.innerHTML = `<span class="auth-link" onclick="openAuthModal('login')">دخول</span>`;
                return;
            }

            const statusResult = await getMyReaderStatus();
            if (statusResult.success && statusResult.data) {
                const { profile, currentLevel } = statusResult.data;
                const displayName = profile.username || (profile.email ? profile.email.split('@')[0] : 'قارئ');
                authArea.innerHTML = `
                    <div class="user-badge" onclick="handleUserBadgeClick()" title="تسجيل الخروج">
                        <span class="badge-icon">${currentLevel ? currentLevel.icon : '📖'}</span>
                        <span>${escapeHtml(displayName)} · ${profile.xp} XP</span>
                    </div>
                `;
            } else {
                authArea.innerHTML = `<span class="auth-link" onclick="openAuthModal('login')">دخول</span>`;
            }
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const msg = document.getElementById('authMessage');
            const btn = document.getElementById('authSubmitBtn');

            msg.textContent = '';
            msg.className = 'auth-message';
            btn.disabled = true;
            btn.textContent = 'جاري المعالجة...';

            try {
                if (authMode === 'signup') {
                    const result = await signUp(email, password);
                    if (!result.success) throw new Error(result.error);
                    msg.textContent = 'تم إنشاء الحساب! تحقق من بريدك الإلكتروني لتأكيده ثم سجّل الدخول.';
                    msg.className = 'auth-message success';
                    switchAuthTab('login');
                } else {
                    const result = await signIn(email, password);
                    if (!result.success) throw new Error(result.error);
                    closeAuthModal();
                    await refreshAuthUI();
                    loadedChapters.forEach(ch => loadComments(ch.id));
                }
            } catch (err) {
                msg.textContent = err.message || 'حدث خطأ ما';
                msg.className = 'auth-message error';
            } finally {
                btn.disabled = false;
                btn.textContent = authMode === 'login' ? 'تسجيل الدخول' : 'إنشاء الحساب';
            }
        });

        window.addEventListener('click', function (event) {
            const authOverlay = document.getElementById('authModalOverlay');
            if (event.target === authOverlay) closeAuthModal();
        });

        /* ==================== Navigation ==================== */
        function goBackToNovel() {
            if (novelId) {
                window.location.href = `novel.html?id=${novelId}`;
            } else {
                window.location.href = 'index.html#stories';
            }
        }

        // Manual jump (used by the "الفصل التالي/السابق" buttons at the end of a chapter
        // when auto-scroll is switched off, or to jump backward).
        function goToChapter(id) {
            window.location.href = `reader.html?novel=${novelId}&chapter=${id}`;
        }

        /* ==================== Comments (namespaced per chapter) ==================== */
        async function loadComments(chapterId) {
            const listEl = document.getElementById(`commentsList-${chapterId}`);
            const formArea = document.getElementById(`commentFormArea-${chapterId}`);
            if (!listEl) return;

            const result = await getComments(chapterId);
            if (!result.success) {
                listEl.innerHTML = `<p style="color:#ff8787; font-size:0.9rem;">تعذر تحميل التعليقات.</p>`;
                return;
            }

            const comments = result.data || [];
            listEl.innerHTML = comments.length > 0
                ? comments.map(c => `
                    <div class="comment-item">
                        <div class="comment-author">${escapeHtml((c.profiles && (c.profiles.username || c.profiles.email)) || 'قارئ')}</div>
                        <div class="comment-content">${escapeHtml(c.content)}</div>
                        <div class="comment-date">${new Date(c.created_at).toLocaleDateString('ar-EG')}</div>
                    </div>
                `).join('')
                : `<p style="color:var(--text-muted); font-size:0.9rem;">لا توجد تعليقات بعد، كن أول من يعلّق!</p>`;

            const session = await checkAuth();
            if (session) {
                formArea.innerHTML = `
                    <div class="comment-form">
                        <textarea id="newCommentText-${chapterId}" placeholder="شارك رأيك في هذا الفصل..."></textarea>
                        <button id="submitCommentBtn-${chapterId}" onclick="submitComment('${chapterId}')">إرسال التعليق (+10 XP)</button>
                    </div>
                `;
            } else {
                formArea.innerHTML = `
                    <div class="comment-login-hint">
                        <span class="auth-link" onclick="openAuthModal('login')">سجّل الدخول</span> لإضافة تعليق واكتساب XP
                    </div>
                `;
            }
        }

        async function submitComment(chapterId) {
            const textarea = document.getElementById(`newCommentText-${chapterId}`);
            const btn = document.getElementById(`submitCommentBtn-${chapterId}`);
            const content = textarea.value.trim();
            if (content.length < 2) return;

            btn.disabled = true;
            btn.textContent = 'جاري الإرسال...';

            const result = await addComment(chapterId, content);

            btn.disabled = false;
            btn.textContent = 'إرسال التعليق (+10 XP)';

            if (!result.success) {
                alert(result.error || 'تعذر إرسال التعليق');
                return;
            }

            textarea.value = '';
            await loadComments(chapterId);

            if (result.xp && result.xp.awarded) {
                showXpToast(10);
            }
            await refreshAuthUI();
        }

        /* ==================== Chapter block rendering ==================== */
        function chapterBlockHtml(chapter, idxInAll) {
            const prevChapter = idxInAll > 0 ? allChapters[idxInAll - 1] : null;
            const nextChapter = idxInAll >= 0 && idxInAll < allChapters.length - 1 ? allChapters[idxInAll + 1] : null;

            return `
                <div class="chapter-block" id="block-${chapter.id}" data-chapter-id="${chapter.id}">
                    <div class="reader-header" id="header-${chapter.id}">
                        <div class="chapter-label">${currentNovel ? escapeHtml(currentNovel.title_ar) : ''}</div>
                        <h1>الفصل ${chapter.chapter_number}: ${escapeHtml(chapter.title)}</h1>
                    </div>
                    <div class="reader-content" id="content-${chapter.id}">${escapeHtml(applyWordFilters(chapter.content))}</div>
                    <div class="chapter-nav">
                        <a class="chapter-nav-btn prev ${prevChapter ? '' : 'disabled'}" ${prevChapter ? `onclick="goToChapter('${prevChapter.id}')"` : ''}>
                            <i class="fas fa-arrow-right"></i> <span>الفصل السابق</span>
                        </a>
                        ${!getAutoScrollPref() ? `
                            <a class="chapter-nav-btn next ${nextChapter ? '' : 'disabled'}" ${nextChapter ? `onclick="goToChapter('${nextChapter.id}')"` : ''}>
                                <span>الفصل التالي</span> <i class="fas fa-arrow-left"></i>
                            </a>
                        ` : ''}
                    </div>
                    <div class="comments-section" id="commentsSection-${chapter.id}">
                        <h3>💬 التعليقات</h3>
                        <div id="commentsList-${chapter.id}"><p style="color:var(--text-muted); font-size:0.9rem;">جاري تحميل التعليقات...</p></div>
                        <div id="commentFormArea-${chapter.id}"></div>
                    </div>
                </div>
            `;
        }

        function updateTopbarFor(chapter) {
            if (!chapter) return;
            activeChapterId = chapter.id;
            document.getElementById('novelNameLabel').textContent = currentNovel ? currentNovel.title_ar : '';
            document.getElementById('chapterNameLabel').textContent = `الفصل ${chapter.chapter_number}: ${chapter.title}`;
            document.title = `${chapter.title} | رِواق`;
            const newUrl = `reader.html?novel=${novelId}&chapter=${chapter.id}`;
            if (window.location.pathname.endsWith('reader.html')) {
                history.replaceState(null, '', newUrl);
            }
        }

        function appendChapterBlock(chapter) {
            const idxInAll = allChapters.findIndex(c => String(c.id) === String(chapter.id));
            const feed = document.getElementById('chaptersFeed');
            const wrapper = document.createElement('div');
            wrapper.innerHTML = chapterBlockHtml(chapter, idxInAll);
            feed.appendChild(wrapper.firstElementChild);

            loadedChapters.push(chapter);
            loadComments(chapter.id);
            observeChapterHeader(chapter.id);

            trackChapterRead(chapter.id).then(async (res) => {
                if (res && res.success && res.awarded) {
                    showXpToast(5);
                    await refreshAuthUI();
                }
            });
        }

        /* ==================== Infinite scroll ==================== */
        let headerObserver = null;
        let sentinelObserver = null;

        function observeChapterHeader(chapterId) {
            const header = document.getElementById(`header-${chapterId}`);
            if (header && headerObserver) headerObserver.observe(header);
        }

        function setupHeaderObserver() {
            headerObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const chapterId = entry.target.id.replace('header-', '');
                        const chapter = loadedChapters.find(c => String(c.id) === String(chapterId));
                        if (chapter && chapter.id !== activeChapterId) {
                            updateTopbarFor(chapter);
                        }
                    }
                });
            }, { root: null, rootMargin: '-35% 0px -55% 0px', threshold: 0 });
        }

        function setupSentinelObserver() {
            const sentinel = document.getElementById('scrollSentinel');
            sentinelObserver = new IntersectionObserver(async (entries) => {
                if (!entries[0].isIntersecting) return;
                if (!getAutoScrollPref()) return;
                await loadNextChapterIfAny();
            }, { root: null, rootMargin: '800px 0px', threshold: 0 });
            sentinelObserver.observe(sentinel);
        }

        async function loadNextChapterIfAny() {
            if (isLoadingNext || reachedEnd) return;
            const lastLoaded = loadedChapters[loadedChapters.length - 1];
            if (!lastLoaded) return;
            const idx = allChapters.findIndex(c => String(c.id) === String(lastLoaded.id));
            const nextMeta = idx >= 0 && idx < allChapters.length - 1 ? allChapters[idx + 1] : null;

            if (!nextMeta) {
                if (!reachedEnd) {
                    reachedEnd = true;
                    renderEndOfNovel();
                }
                return;
            }

            isLoadingNext = true;
            renderLoadingNext();

            const result = await getChapter(nextMeta.id);

            removeLoadingNext();
            isLoadingNext = false;

            if (result.success && result.data) {
                appendChapterBlock(result.data);
            } else {
                renderLoadError();
            }
        }

        function renderLoadingNext() {
            const feed = document.getElementById('chaptersFeed');
            const el = document.createElement('div');
            el.className = 'loading-next';
            el.id = 'loadingNextIndicator';
            el.innerHTML = `<div class="spinner"></div><span>جاري تحميل الفصل التالي...</span>`;
            feed.appendChild(el);
        }

        function removeLoadingNext() {
            const el = document.getElementById('loadingNextIndicator');
            if (el) el.remove();
        }

        function renderLoadError() {
            const feed = document.getElementById('chaptersFeed');
            const el = document.createElement('div');
            el.className = 'loading-next';
            el.innerHTML = `<span>تعذر تحميل الفصل التالي. <a href="#" onclick="loadNextChapterIfAny();return false;" style="color:var(--primary-gold);">إعادة المحاولة</a></span>`;
            feed.appendChild(el);
        }

        function renderEndOfNovel() {
            const feed = document.getElementById('chaptersFeed');
            const el = document.createElement('div');
            el.className = 'end-of-novel';
            el.innerHTML = `
                <i class="fas fa-flag-checkered"></i>
                <div>وصلت إلى آخر فصل منشور حالياً.</div>
                <div style="margin-top:0.5rem;"><a href="novel.html?id=${novelId}">العودة إلى صفحة الرواية</a></div>
            `;
            feed.appendChild(el);
        }

        /* ==================== Load Reader (initial) ==================== */
        async function loadReader() {
            if (!novelId || !initialChapterId) {
                document.getElementById('chaptersFeed').innerHTML = `
                    <div class="reader-error">
                        <i class="fas fa-book-open"></i>
                        لم يتم تحديد فصل للقراءة.
                    </div>
                `;
                return;
            }

            const [novelResult, chaptersResult, chapterResult] = await Promise.all([
                getNovel(novelId),
                getChapters(novelId, true),
                getChapter(initialChapterId)
            ]);

            if (!chapterResult.success) {
                document.getElementById('chaptersFeed').innerHTML = `
                    <div class="reader-error">
                        <i class="fas fa-exclamation-circle"></i>
                        تعذر تحميل الفصل. قد يكون غير متاح حالياً.
                    </div>
                `;
                return;
            }

            currentNovel = novelResult.success ? novelResult.data : null;
            allChapters = chaptersResult.success ? chaptersResult.data : [];

            document.getElementById('chaptersFeed').innerHTML = '';
            setupHeaderObserver();
            setupSentinelObserver();

            appendChapterBlock(chapterResult.data);
            updateTopbarFor(chapterResult.data);

            window.scrollTo(0, 0);
        }

        loadFontPrefs();
        renderWordFiltersUI();
        refreshAuthUI();
        loadReader();
    </script>
</body>
</html>
